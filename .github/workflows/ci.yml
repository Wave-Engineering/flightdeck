name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Exercise the release guard here (#24). It is otherwise invoked only by
      # release.yml on a v* tag, so its FIRST run in life would be release day —
      # where a bug in it reds the tag build and forces a retag. Both directions
      # are asserted: the matching ref must pass, and a deliberate mismatch must
      # fail, so a guard that has quietly stopped guarding cannot pass silently.
      - name: Exercise the version guard (both directions)
        run: |
          bash scripts/ci/check-version.sh "refs/tags/v$(grep -m1 '"version"' package.json | sed -E 's/.*"([^"]+)".*/\1/')"
          if bash scripts/ci/check-version.sh refs/tags/v0.0.0-deliberate-mismatch; then
            echo "check-version.sh accepted a mismatched tag — the guard is inert" >&2
            exit 1
          fi
      - run: npm install -g bun@1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
