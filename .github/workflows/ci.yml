name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g bun@1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
