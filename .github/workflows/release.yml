name: Release

# Build the FlightDeck image and publish it to GHCR so the operator can pull it
# (S5.4 / #878). DEFINED, not triggered — a release happens only when a human
# pushes a v* tag or publishes a GitHub Release. No deploy is performed here.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]

# Least-privilege default: read-only, inherited by the test job (which never pushes).
# The publish job grants itself packages:write to push to ghcr.io.
permissions:
  contents: read

env:
  # GHCR path must be lowercase (org "Wave-Engineering" -> wave-engineering).
  IMAGE: ghcr.io/wave-engineering/flightdeck

jobs:
  # Gate publish on the same checks CI runs, so a tag can never ship red code.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g bun@1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags + labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
