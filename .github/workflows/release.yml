name: Release

# Build the FlightDeck image and publish it to GHCR so the operator can pull it
# (S5.4 / #878). DEFINED, not triggered — a release happens only when a human
# pushes a v* tag or publishes a GitHub Release. No deploy is performed here.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]

# Least-privilege default: read-only, inherited by the test job (which never pushes).
# The publish job grants itself packages:write to push to ghcr.io.
permissions:
  contents: read

env:
  # GHCR path must be lowercase (org "Wave-Engineering" -> wave-engineering).
  IMAGE: ghcr.io/wave-engineering/flightdeck

jobs:
  # Gate publish on the same checks CI runs, so a tag can never ship red code.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Fail before anything is built if the tag and package.json disagree (#24).
      # The image bakes the GIT TAG (steps.meta.outputs.version, below) into
      # FLIGHTDECK_VERSION; this guard is what keeps package.json honest against
      # it. Invoked via `bash` so the check never depends on a committed mode bit.
      - name: Check tag matches package.json version
        run: bash scripts/ci/check-version.sh
      - run: npm install -g bun@1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign (Fulcio/Rekor) via the shared oaw-sign-image action
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      release_refs: ${{ steps.mirror.outputs.release-refs }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # NOTE: Docker Hub login is deliberately AFTER the build (see #20). The oakandwave
      # Org Access Token is scoped to oakandwave/* only; logging into Docker Hub before
      # the build makes buildx present it for ALL docker.io pulls, and it cannot pull
      # docker/dockerfile:1 or the oven/bun base (401 insufficient scopes) -> build fails.
      # Building with no Docker Hub creds keeps those public pulls anonymous (they work).

      - name: Derive tags + labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Build + push GHCR only; the Docker Hub copy is a decoupled mirror step below.
          images: ${{ env.IMAGE }}
          # Force the OCI source/url labels lowercase (the org login "Wave-Engineering"
          # would otherwise bake a capital via metadata-action's auto-source).
          labels: |
            org.opencontainers.image.source=https://github.com/wave-engineering/flightdeck
            org.opencontainers.image.url=https://github.com/wave-engineering/flightdeck
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and push (GHCR)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Bake build identity into the image (#24) so the running service can
          # report it on /health and in the UI topbar. `version` here is the
          # semver-stripped tag (v0.2.8 -> 0.2.8), matching the image tag.
          build-args: |
            FLIGHTDECK_VERSION=${{ steps.meta.outputs.version }}
            FLIGHTDECK_GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign the GHCR image (cosign keyless + SBOM)
        # Consumer #1 of cc-workflow's reusable oaw-sign-image action (fleet signing rollout).
        # Signs the immutable digest; the GHCR login above is active and id-token grants OIDC.
        # flightdeck's image is small, so the SBOM goes to rekor (action default) — no TSA.
        uses: wave-engineering/claudecode-workflow/.github/actions/oaw-sign-image@21f10ce601b9340b30fd6df0b4a2e4bd663fe249
        with:
          digest-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}

      - name: Log in to Docker Hub
        # AFTER the build (see the note above): the OAT is only ever presented to docker.io
        # for the oakandwave push it is scoped for. Serves both the mirror and Scout below.
        uses: docker/login-action@v3
        with:
          username: oakandwave
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Mirror the GHCR digest to Docker Hub oakandwave
        # Shared oaw-mirror-image action (claudecode-workflow#1326): copies the exact digest
        # under every tag (ghcr via the GHCR login, docker.io via the OAT), but pushes a version
        # tag (X.Y.Z) only when it is absent, and fails with nothing pushed if one already names
        # another digest. Rebuilds nothing.
        id: mirror
        uses: wave-engineering/claudecode-workflow/.github/actions/oaw-mirror-image@d82d57ba3553ea5f82d3267f7c1e98d944a07a3a
        with:
          source-digest-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          tags: ${{ steps.meta.outputs.tags }}
          dest-image: docker.io/oakandwave/flightdeck

      - name: Sign the Docker Hub image (cosign keyless + SBOM)
        # The mirror copies the content-identical manifest, so the Docker Hub digest equals the
        # GHCR digest — but cosign signatures are registry+digest-bound, so the mirror needs its
        # own signature. The Docker Hub login above is active. Same shared action.
        uses: wave-engineering/claudecode-workflow/.github/actions/oaw-sign-image@21f10ce601b9340b30fd6df0b4a2e4bd663fe249
        with:
          digest-ref: docker.io/oakandwave/flightdeck@${{ steps.build.outputs.digest }}

      - name: Docker Scout — CVE scan the pushed image
        # Scans the actual image layers for known CVEs (complements trivy's dep scan).
        # Non-blocking for now: reports to the job summary, never fails the release; make
        # it a gate later with `exit-code: true` once the baseline is clean.
        # continue-on-error covers ALL failures (auth/infra), not just CVE-threshold ones:
        # the oakandwave OAT's Scout-backend auth is unproven, and a Scout auth error must
        # never red a release whose dual-push already succeeded (#20 review).
        continue-on-error: true
        uses: docker/scout-action@v1
        with:
          command: cves
          image: docker.io/oakandwave/flightdeck:${{ steps.meta.outputs.version }}
          only-severities: critical,high
          write-comment: false

  # Write the image's digest-pinned refs into the GitHub release. Its own job, after the
  # mirror and both signatures, so a release-API failure can't stop a signature, and
  # contents: write sits on a job that runs no registry or signing tooling.
  release-notes:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Write the image digest into the release
        # A tag push with no release creates one (generated notes); a release published by
        # hand gets the Images block appended, or replaced on a rerun. A release this job
        # creates with GITHUB_TOKEN triggers no workflow, so it can't loop back here.
        uses: wave-engineering/claudecode-workflow/.github/actions/oaw-release-images@d82d57ba3553ea5f82d3267f7c1e98d944a07a3a
        with:
          release-tag: ${{ github.ref_name }}
          release-refs: ${{ needs.publish.outputs.release_refs }}
          source-digest-ref: ${{ env.IMAGE }}@${{ needs.publish.outputs.digest }}
          create-if-missing: "true"
